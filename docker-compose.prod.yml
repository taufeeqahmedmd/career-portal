# Production docker-compose for running alongside existing Nginx
# Use this when you have other websites in /var/www and want to use host Nginx.
# NOTE: host Nginx must proxy /api/ to http://localhost:5001 (see README).

services:
  postgres:
    image: postgres:16-alpine
    container_name: career-app-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-careers}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-careers}
      - POSTGRES_DB=${POSTGRES_DB:-careers}
    ports:
      # Loopback ONLY, so a GUI client (HeidiSQL, pgAdmin, DBeaver) can reach it
      # over an SSH tunnel. The database holds every candidate's personal data;
      # binding this to 0.0.0.0 would put it on the public internet behind
      # nothing but a password.
      - "127.0.0.1:5432:5432"
    volumes:
      - career-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careers} -d ${POSTGRES_DB:-careers}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Connection pooler. The backend talks to this instead of PostgreSQL directly,
  # so many short-lived client connections are multiplexed onto a small number
  # of real server connections.
  #
  # transaction mode is safe here: the application uses no named prepared
  # statements, no session-level SET, no temp tables, no LISTEN/NOTIFY, and its
  # one explicit transaction (branch rename) holds a server connection for its
  # duration by design.
  #
  # To bypass it, set DB_HOST=postgres in .env and redeploy - one variable.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: career-app-pgbouncer
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-careers}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-careers}
      - DB_NAME=${POSTGRES_DB:-careers}
      # This image defaults to 5432; 6432 is the conventional PgBouncer port
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - AUTH_TYPE=scram-sha-256
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-200}
      - DEFAULT_POOL_SIZE=${PGBOUNCER_POOL_SIZE:-20}
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      # node-postgres sends extra_float_digits on connect; PgBouncer rejects
      # unknown startup parameters unless they are listed here
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,options,search_path
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-careers} || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: career-app-backend
    restart: unless-stopped
    ports:
      # Bound to loopback ONLY. Host Nginx reaches it at 127.0.0.1:5001 and is
      # the sole way in.
      #
      # Publishing this on 0.0.0.0 would be actively dangerous alongside
      # TRUST_PROXY: anyone could hit the API directly, bypass TLS, and forge
      # X-Forwarded-For to get a fresh rate-limit bucket per request - which
      # defeats the login, password-reset and application-form limits entirely.
      - "127.0.0.1:5001:5001"
    environment:
      - PORT=5001
      # DB_HOST/DB_PORT decide whether traffic goes through PgBouncer or
      # straight to PostgreSQL. Set DB_HOST=postgres DB_PORT=5432 in .env to
      # bypass the pooler without touching this file.
      - DATABASE_URL=postgres://${POSTGRES_USER:-careers}:${POSTGRES_PASSWORD:-careers}@${DB_HOST:-pgbouncer}:${DB_PORT:-6432}/${POSTGRES_DB:-careers}
      # Shared cache. Unset it and the app falls back to an in-process cache,
      # which is equivalent while a single backend container serves traffic.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-60}
      - JWT_SECRET=${JWT_SECRET}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - APP_URL=${APP_URL:-}
      # Host Nginx proxies /api/ to this container, so every request arrives
      # from the proxy. Without this the rate limiters see one client and a
      # handful of failed logins locks out everyone.
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # Lock the API to the site's own origin, e.g.
      # ALLOWED_ORIGINS=https://careers.pallavimodelschools.org
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Kolkata}
      # Cloudflare Turnstile - the spam defence on the public application form
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - INITIAL_USER_PASSWORD=${INITIAL_USER_PASSWORD:-12345678}
      - INITIAL_PASSWORD_DAYS=${INITIAL_PASSWORD_DAYS:-7}
      # Deliberately empty: a production database must not come up publishing
      # the sample vacancies. Set to true only to demo on a throwaway instance.
      - SEED_SAMPLE_DATA=${SEED_SAMPLE_DATA:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - GOOGLE_SERVICE_ACCOUNT_KEY=${GOOGLE_SERVICE_ACCOUNT_KEY:-}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REFRESH_TOKEN=${GOOGLE_OAUTH_REFRESH_TOKEN:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - career-uploads:/app/uploads
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: career-app-redis
    restart: unless-stopped
    # Cache only - no persistence needed. Everything in here is rebuildable
    # from PostgreSQL, and an empty cache after a restart is simply a miss.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory ${REDIS_MAXMEMORY:-128mb}
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  career-pgdata:
    driver: local
  career-uploads:
    driver: local
